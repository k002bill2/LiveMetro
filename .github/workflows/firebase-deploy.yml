name: Firebase Deploy

# main push 시 Cloud Functions + Firestore rules/indexes 자동 배포.
# PR 또는 다른 브랜치에서는 실행되지 않음.
#
# Required secrets:
#   FIREBASE_SERVICE_ACCOUNT — JSON 형식의 서비스 계정 키
#                              firebase-tools deploy 권한 필요

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # 이 워크플로는 push 하지 않는다 — GITHUB_TOKEN 을 .git/config 에 남기지 않는다(F-06).
          persist-credentials: false
      - name: Quality gate
        uses: ./.github/actions/quality-gate
        with:
          node-version: '20'
          run-functions-build: 'true'

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # 이 워크플로는 push 하지 않는다 — GITHUB_TOKEN 을 .git/config 에 남기지 않는다(F-06).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build Functions
        working-directory: functions
        run: npm run build

      # functions/.env는 gitignored — clean checkout에는 없으므로 여기서 생성한다.
      # 없으면 firebase-tools가 defineString('KAKAO_APP_ID') 기본값('')으로 배포해
      # kakaoLogin이 모든 요청을 failed-precondition으로 거부한다.
      # KAKAO_APP_ID는 Kakao 앱의 공개 식별자(자격증명 아님)라 평문으로 안전하다.
      - name: Provision Functions params (KAKAO_APP_ID)
        working-directory: functions
        run: echo "KAKAO_APP_ID=1514990" > .env

      # 비밀은 run: 본문에 ${{ }} 로 직접 확장하지 않고 env: 로 넘긴다(F-06) — 직접 확장은
      # 셸 스크립트 텍스트에 키가 박혀 JSON 의 ' 가 쿼팅을 깨고 로그·프로세스 인자로 샐 수 있다.
      # umask 077 로 sa.json 을 600 으로 만든다.
      - name: Authenticate to Firebase
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # firebase-tools 는 정확한 버전으로 고정한다(F-06) — 미고정 `npx --yes` 는 자격증명이
      # 환경에 있는 상태에서 매 실행 최신 버전을 내려받아 실행한다(공급망 위험).
      # 15.34.1 근거: 2026-10-30 기준 registry latest=15.34.2(10-28 배포)였으나 배포 1일차라
      # 직전 패치(10-21 배포)를 택함. engines node>=20 — 이 job 의 Node 20 과 호환.
      # 갱신은 수동(이 줄): 릴리스 노트 확인 후 버전만 올린다.
      - name: Deploy Functions + Firestore rules
        run: npx --yes firebase-tools@15.34.1 deploy --only functions,firestore:rules,firestore:indexes --non-interactive

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
