name: Preview OTA Publish

# main 푸시(앱 코드 변경) 시 preview 채널로 OTA 자동 발행. workflow_dispatch로 채널 수동 선택 가능.
# functions/**, docs/**, .github/** 만 바뀐 푸시는 paths 필터로 걸러져 발행하지 않음.
#
# eas-build.yml과 달리 번들링이 EAS 서버가 아닌 이 러너에서 일어난다.
# EXPO_PUBLIC_* 는 Metro가 번들 타임에 inline 하므로 아래 시크릿이 job env로 전부 필요하다.
#
# Required secrets:
#   EXPO_TOKEN                               — Expo robot 계정 토큰 (eas-cli 인증)
#   EXPO_PUBLIC_FIREBASE_API_KEY             — Firebase 웹 앱 설정 (src/services/firebase/config.ts)
#   EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
#   EXPO_PUBLIC_FIREBASE_PROJECT_ID
#   EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
#   EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#   EXPO_PUBLIC_FIREBASE_APP_ID
#   EXPO_PUBLIC_SEOUL_SUBWAY_API_KEY         — 실시간 도착 API (swopenapi.seoul.go.kr)
#   EXPO_PUBLIC_DATA_PORTAL_API_KEY          — 시간표 API (openapi.seoul.go.kr:8088, 인증 도메인이 다름)
#   EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID         — Google OAuth Web Client ID.
#                                              googleSignIn.ts가 falsy면 SocialAuthError를 던져
#                                              Google 로그인이 통째로 죽는다 (빌드는 초록).
#
# Optional secrets (rotation 슬롯 — 없으면 키 개수만 줄고 발행은 진행):
#   EXPO_PUBLIC_SEOUL_SUBWAY_API_KEY_2
#   EXPO_PUBLIC_SEOUL_SUBWAY_API_KEY_3
#   EXPO_PUBLIC_DATA_PORTAL_API_KEY_2

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'App.tsx'
      # 번들 엔트리. 여기가 바뀌면 당연히 재발행해야 한다.
      - 'index.js'
      - 'app.json'
      # app.config.ts는 app.json보다 우선하는 권위 설정이다 (파일 헤더 참조).
      # app.json만 걸어두면 config 변경이 조용히 미발행된다.
      - 'app.config.ts'
      # 번들 산출물을 바꾸는 빌드 설정: babel(path alias·reanimated), metro(resolver blockList).
      # 실제로 metro.config.js만 바뀐 커밋(c8c7463), app.config.ts만 바뀐 커밋(89a5b1e)이 있었다.
      - 'babel.config.js'
      - 'metro.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      # patch-package 패치는 번들 결과물을 바꾸므로 재발행 대상이다.
      - 'patches/**'
  workflow_dispatch:
    inputs:
      channel:
        description: EAS Update channel
        type: choice
        required: true
        default: preview
        options: [preview, production]

permissions:
  contents: read

concurrency:
  group: preview-ota
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Quality gate (no Functions rebuild — OTA는 앱 번들만 발행)
        uses: ./.github/actions/quality-gate
        with:
          node-version: '20'
          run-functions-build: 'false'

  publish:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 번들 타임 inline 대상이라 export 스텝이 필요로 한다. 필수 키 검사 스텝도 같은 값을 읽으므로
    # 스텝별 중복 대신 job 레벨에 한 번만 선언한다.
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_SEOUL_SUBWAY_API_KEY: ${{ secrets.EXPO_PUBLIC_SEOUL_SUBWAY_API_KEY }}
      EXPO_PUBLIC_SEOUL_SUBWAY_API_KEY_2: ${{ secrets.EXPO_PUBLIC_SEOUL_SUBWAY_API_KEY_2 }}
      EXPO_PUBLIC_SEOUL_SUBWAY_API_KEY_3: ${{ secrets.EXPO_PUBLIC_SEOUL_SUBWAY_API_KEY_3 }}
      EXPO_PUBLIC_DATA_PORTAL_API_KEY: ${{ secrets.EXPO_PUBLIC_DATA_PORTAL_API_KEY }}
      EXPO_PUBLIC_DATA_PORTAL_API_KEY_2: ${{ secrets.EXPO_PUBLIC_DATA_PORTAL_API_KEY_2 }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # eas-cli(latest)의 전이 의존성 @oclif/plugin-autocomplete가 Node>=22를 요구해
      # Node 20에서는 "Setup EAS CLI" 설치가 EBADENGINE으로 죽는다. 러너만 22로
      # 올린다 — package.json의 engines.node는 EAS **빌드 서버**의 Node를 고르는
      # 값이라 여기서 넓히면 프로덕션 빌드 환경이 딸려 바뀐다. 그 불일치로 npm ci가
      # EBADENGINE 경고를 내지만, .npmrc에 engine-strict가 없어 실패하지 않는다.
      # guard 잡은 eas-cli를 쓰지 않으므로 Node 20 그대로 둔다.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # 8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # postinstall(patch-package)이 patches/@expo+cli+0.10.17.patch를 적용한다.
      # 이 패치가 없으면 아래 export가 minimatch default-import 충돌로 TypeError를 낸다.
      - name: Install dependencies
        run: npm ci

      # 값은 절대 출력하지 않는다 — 누락된 키 "이름"만 알린다.
      - name: Verify required EXPO_PUBLIC_* secrets
        run: |
          missing=()
          for key in \
            EXPO_PUBLIC_FIREBASE_API_KEY \
            EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN \
            EXPO_PUBLIC_FIREBASE_PROJECT_ID \
            EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET \
            EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            EXPO_PUBLIC_FIREBASE_APP_ID \
            EXPO_PUBLIC_SEOUL_SUBWAY_API_KEY \
            EXPO_PUBLIC_DATA_PORTAL_API_KEY \
            EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required EXPO_PUBLIC_* secrets are present."

      # 2단계 발행 1/2: eas-cli가 내부적으로 셸하는 export는 SDK 50+ 문법(--source-maps)을
      # 가정해 SDK 49 @expo/cli에서 죽는다. 번들을 먼저 만들고 아래에서 --skip-bundler로 올린다.
      - name: Export JS bundles (Metro)
        run: npx expo export --platform ios --platform android --output-dir dist --dump-assetmap

      # 2단계 발행 2/2. 커밋 메시지는 여러 줄일 수 있으므로 env로 넘겨 셸에서 인용하고,
      # 첫 줄만 잘라 --message에 싣는다. workflow_dispatch에서는 head_commit이 없어 빈 값이다.
      - name: Publish EAS Update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CHANNEL: ${{ inputs.channel || 'preview' }}
        run: |
          summary="$(printf '%s' "${COMMIT_MESSAGE:-manual dispatch}" | head -n 1 | cut -c 1-180)"
          eas update \
            --channel "$CHANNEL" \
            --skip-bundler \
            --message "$summary (${GITHUB_SHA:0:7})" \
            --non-interactive
