name: EAS Build (Production)

# 태그 푸시 시 production 빌드 트리거. main 브랜치 commit에서는 실행되지 않음.
# Required secrets:
#   EXPO_TOKEN — Expo robot 계정 토큰 (eas-cli 인증)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        type: choice
        required: true
        default: all
        options: [all, ios, android]
      profile:
        description: EAS profile
        type: choice
        required: true
        default: production
        options: [production, preview]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Quality gate (no Functions rebuild — already verified on main)
        uses: ./.github/actions/quality-gate
        with:
          node-version: '22'
          run-functions-build: 'false'

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # eas-cli(latest)의 전이 의존성 @oclif/plugin-autocomplete가 Node>=22를 요구해
      # Node 20에서는 "Setup EAS CLI" 설치가 EBADENGINE으로 죽는다. 그래서 러너는 22.
      # EAS **빌드 서버**의 Node는 eas.json 빌드 프로필(development·preview·production)의
      # `node`(22.23.4)로 고정한다 — engines.node 변경이 빌드 환경을 딸려 바꾸지 않도록
      # 프로필에 먼저 고정한 뒤 engines.node를 ">=22.19.0"으로 맞췄다(러너와 일치).
      # guard 잡은 ci.yml 과 같은 Node 22로 품질 게이트를 돌린다(wdio 10 · appium 3 이 Node>=22.19 요구).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06  # 9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS build
        run: |
          eas build \
            --platform ${{ inputs.platform || 'all' }} \
            --profile ${{ inputs.profile || 'production' }} \
            --non-interactive \
            --no-wait
