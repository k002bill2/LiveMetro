version: 2
updates:
  # GitHub Actions 는 40자 SHA 로 pin 되어 있다(공급망 변조 차단).
  # Dependabot 은 `uses:` 뒤 trailing 주석의 semver 를 읽어 갱신 PR 을 만든다 —
  # 주석을 지우면 이 갱신 경로가 끊기므로 pin 교체 시 주석을 반드시 유지할 것.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"

  # npm 의존성(F-09) — 루트 RN 앱과 functions/ 는 lockfile 이 따로라 항목을 분리한다.
  # 그룹 정책: minor+patch 는 한 PR 로 묶고, major 는 별도 그룹으로 분리해 소음을 줄인다.
  # major 를 ignore 하지 않는 이유: ignore 는 보안 패치 경로까지 가릴 수 있어 F-09 의 목적
  # (수정 가능한 취약점이 자동으로 올라오는 것)과 충돌한다 — 묶어서 보이게만 하고 판단은 사람이 한다.
  # 주의(루트): expo / react-native 계열 major 는 Expo SDK 에 묶여 있어 Dependabot PR 로 올리지 말고
  # `npx expo install --fix` 로 SDK 단위 업그레이드한다. 또 루트 package.json·lockfile 변경은
  # main 머지 시 preview-ota.yml 을 트리거하므로, 네이티브 모듈이 바뀌는 PR 은 OTA 대신 빌드가 필요하다.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
    # Expo SDK 가 버전을 고정하는 패키지는 Dependabot 이 올리지 않는다 — SDK 업그레이드 시
    # `npx expo install --fix` 로 일괄 정렬한다. (#393: minor 그룹에 react 19.3·react-native 0.88 등이
    # 섞여 루트 tsc 가 깨짐.) 목록 기준 = expo/bundledNativeModules.json 에 있는 루트 의존성 +
    # @types/react(react 핀과 짝). 비관리 react-native-* 라이브러리는 막지 않도록 와일드카드 대신 이름을 나열한다.
    # 새 Expo 모듈을 추가하면 expo-* 외에는 여기도 추가할 것.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-web"
      - dependency-name: "react-native-webview"
      - dependency-name: "react-native-worklets"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/*"
      # major 만 보류(#399 triage) — Expo SDK 58(jest-expo 가 jest 30·RNTL 14 지원) 또는
      # 상위 도구 지원(Babel 8: babel-preset-expo, TS 7·ESLint 10: typescript-eslint/플러그인) 전까지.
      # minor/patch(보안 수정 포함)는 계속 올라온다. SDK 업그레이드 PR 에서 이 블록을 정리할 것.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@testing-library/react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # 7.x는 React Compiler 규칙으로 177 errors(#399 triage) — 별도 정리 후 해제
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]

  # Firebase Functions(Node 20) — main 머지 시 firebase-deploy.yml 이 자동 배포하므로
  # 머지 전 functions 빌드·테스트 통과를 반드시 확인한다.
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      functions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      functions-major:
        patterns:
          - "*"
        update-types:
          - "major"
    # typescript 는 @typescript-eslint 8.x peer(<6.1.0) 안에서만 올린다 — 7.x(#401·#406)는
    # ERESOLVE 로 npm ci 가 깨진다. typescript-eslint 가 TS 6.1+/7 을 지원하면 해제할 것.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
