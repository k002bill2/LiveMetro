version: 2
updates:
  # GitHub Actions 는 40자 SHA 로 pin 되어 있다(공급망 변조 차단).
  # Dependabot 은 `uses:` 뒤 trailing 주석의 semver 를 읽어 갱신 PR 을 만든다 —
  # 주석을 지우면 이 갱신 경로가 끊기므로 pin 교체 시 주석을 반드시 유지할 것.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
